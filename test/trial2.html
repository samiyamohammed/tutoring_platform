<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .chat-container {
      max-width: 800px;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      background-color: white;
    }
    .chat-header {
      background-color: #0d6efd;
      color: white;
      padding: 15px;
      border-radius: 10px 10px 0 0;
    }
    .chat-messages {
      height: 400px;
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 5px;
      max-width: 70%;
    }
    .sent {
      background-color: #e3f2fd;
      margin-left: auto;
    }
    .received {
      background-color: #f1f1f1;
      margin-right: auto;
    }
    .typing-indicator {
      font-style: italic;
      color: #6c757d;
      padding: 5px 15px;
    }
    .chat-input {
      padding: 15px;
      border-top: 1px solid #eee;
    }
    #chatRooms {
      height: 100%;
      border-right: 1px solid #eee;
    }
    .room-item {
      cursor: pointer;
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .room-item:hover {
      background-color: #f8f9fa;
    }
    .room-item.active {
      background-color: #e9ecef;
    }
    .unread-count {
      background-color: #0d6efd;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 12px;
      margin-left: auto;
    }
    .logout-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="container-fluid chat-container">
    <button id="logoutButton" class="btn btn-danger logout-btn" style="display: none;">Logout</button>
    <div class="row">
      <!-- Chat Rooms List -->
      <div class="col-md-3 p-0" id="chatRooms">
        <div class="chat-header">Chat Rooms</div>
        <div id="roomsList" class="list-group list-group-flush"></div>
      </div>
      
      <!-- Chat Area -->
      <div class="col-md-9 p-0">
        <div class="chat-header d-flex justify-content-between align-items-center">
          <span id="currentRoomName">Select a chat</span>
          <div id="typingIndicator" class="typing-indicator" style="display: none;"></div>
        </div>
        
        <div class="chat-messages" id="messagesContainer">
          <div class="text-center text-muted">Select a chat to start messaging</div>
        </div>
        
        <div class="chat-input">
          <div class="input-group">
            <input type="text" class="form-control" id="messageInput" placeholder="Type a message..." disabled>
            <button class="btn btn-primary" id="sendButton" disabled>Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="false" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Login to Chat</h5>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
